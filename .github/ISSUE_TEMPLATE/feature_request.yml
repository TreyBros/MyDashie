name: Feature request
description: Suggest something that would make MyDashie better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The dashboard or workflow you have in mind, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
