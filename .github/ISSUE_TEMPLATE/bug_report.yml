name: Bug report
description: Something in MyDashie doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Ask Dashie for …\n2. …"
  - type: input
    id: version
    attributes:
      label: MyDashie version
      description: Settings → General shows it. Say "source" plus the commit if you built it yourself.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.2, Apple silicon
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything relevant from the app's log. Remove API keys and personal data first.
      render: text
